services:
  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: ${NEO4J_USER}/${NEO4J_PASSWORD}
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    restart: unless-stopped

  backend:
    build:
      context: ../tubulinxyz_src
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      NEO4J_CURRENTDB: ${NEO4J_CURRENTDB}
      SECRET_KEY: ${SECRET_KEY}
      TUBXZ_ROOT: /app
      TUBETL_DATA: /mnt/tubetl_data
      NCBI_TAXA_SQLITE: /mnt/ncbi_taxonomy.sqlite
    volumes:
      - ../tubulinxyz_src/data:/app/data
      - ${TUBETL_DATA_HOST}:/mnt/tubetl_data
      - ${NCBI_TAXA_SQLITE_HOST}:/mnt/ncbi_taxonomy.sqlite:ro
    depends_on:
      - neo4j
    restart: unless-stopped

  frontend:
    build:
      context: ../tubulinxyz_fend_src
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${CERTS_PATH:-./nginx/certs}:/etc/nginx/certs:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

  ingest:
    image: deploy-backend
    profiles: [ingest]
    networks:
      - default
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      NEO4J_CURRENTDB: ${NEO4J_CURRENTDB}
      TUBXZ_ROOT: /app
      TUBETL_DATA: /mnt/tubetl_data
      NCBI_TAXA_SQLITE: /mnt/ncbi_taxonomy.sqlite
    volumes:
      - ../tubulinxyz_src/data:/app/data
      - ${TUBETL_DATA_HOST}:/mnt/tubetl_data
      - ${NCBI_TAXA_SQLITE_HOST}:/mnt/ncbi_taxonomy.sqlite:ro
    depends_on:
      - neo4j
    entrypoint: ["python", "cli.py"]

volumes:
  neo4j_data:
  neo4j_logs:
