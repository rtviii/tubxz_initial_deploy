services:
  neo4j:
    image: neo4j:5
    ports:
      - "7687:7687"
      - "7474:7474"   # browser UI, optional
    environment:
      NEO4J_AUTH: ${NEO4J_USER}/${NEO4J_PASSWORD}
      NEO4J_server_memory_heap_initial__size: 1G
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 1G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "${NEO4J_USER}", "-p", "${NEO4J_PASSWORD}", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 4G

  # Background service: initializes DB, collects structures, uploads them.
  # Runs on every deploy. Idempotent -- detects what's already done and skips it.
  # Writes progress to /var/log/tubxz/bootstrap_status.json (shared with backend).
  bootstrap:
    image: ${BACKEND_IMAGE:-ghcr.io/rtviii/tubulinxyz:latest}
    pull_policy: ${BACKEND_PULL_POLICY:-always}
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      NEO4J_CURRENTDB: ${NEO4J_CURRENTDB}
      TUBXZ_ROOT: /app
      TUBETL_DATA: /mnt/tubetl_data
      NCBI_TAXA_SQLITE: /app/.etetoolkit/taxa.sqlite
    volumes:
      - ${TUBETL_DATA_HOST}:/mnt/tubetl_data
      - ingest_logs:/var/log/tubxz
    depends_on:
      neo4j:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/app/scripts/init_and_seed.sh"]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 4G

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/rtviii/tubulinxyz:latest}
    pull_policy: ${BACKEND_PULL_POLICY:-always}
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      NEO4J_CURRENTDB: ${NEO4J_CURRENTDB}
      SECRET_KEY: ${SECRET_KEY}
      TUBXZ_ROOT: /app
      TUBETL_DATA: /mnt/tubetl_data
      NCBI_TAXA_SQLITE: /app/.etetoolkit/taxa.sqlite
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
    volumes:
      - ${TUBETL_DATA_HOST}:/mnt/tubetl_data
      - ingest_logs:/var/log/tubxz:ro
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 2G

  scheduler:
    image: ${BACKEND_IMAGE:-ghcr.io/rtviii/tubulinxyz:latest}
    pull_policy: ${BACKEND_PULL_POLICY:-always}
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      NEO4J_CURRENTDB: ${NEO4J_CURRENTDB}
      TUBXZ_ROOT: /app
      TUBETL_DATA: /mnt/tubetl_data
      NCBI_TAXA_SQLITE: /app/.etetoolkit/taxa.sqlite
    volumes:
      - ${TUBETL_DATA_HOST}:/mnt/tubetl_data
      - ingest_logs:/var/log/tubxz
    depends_on:
      neo4j:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/app/scripts/start_scheduler.sh"]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 4G

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/rtviii/tubulinxyz-frontend:latest}
    pull_policy: ${FRONTEND_PULL_POLICY:-always}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${CERTS_PATH:-./nginx/certs}:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 128M

  # Manual ingest service (kept for ad-hoc CLI access)
  ingest:
    image: ${BACKEND_IMAGE:-ghcr.io/rtviii/tubulinxyz:latest}
    pull_policy: ${BACKEND_PULL_POLICY:-always}
    profiles: [ingest]
    networks:
      - default
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      NEO4J_CURRENTDB: ${NEO4J_CURRENTDB}
      TUBXZ_ROOT: /app
      TUBETL_DATA: /mnt/tubetl_data
      NCBI_TAXA_SQLITE: /app/.etetoolkit/taxa.sqlite
    volumes:
      - ${TUBETL_DATA_HOST}:/mnt/tubetl_data
    depends_on:
      neo4j:
        condition: service_healthy
    entrypoint: ["python", "cli.py"]

volumes:
  neo4j_data:
  neo4j_logs:
  ingest_logs:
